name: Publish Package

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked --dev
    
    - name: Check version consistency
      run: |
        set -e
    
        PACKAGE_NAME="gwrefpy"
    
        # -----------------------------
        # Extract versions from sources
        # -----------------------------
    
        INIT_VERSION=$(python -c "from gwrefpy import __version__; print(__version__)")
    
        TOML_VERSION=$(python -c "import tomllib; data = tomllib.load(open('pyproject.toml', 'rb')); print(data['project']['version'] if 'version' in data['project'] else data['tool']['setuptools']['dynamic']['version'].split(\"'\")[1])" \
          2>/dev/null || \
          python -c "import toml; data = toml.load('pyproject.toml'); print(data.get('project', {}).get('version', ''))")
    
        SH_VERSION=$(python -c "from docs.conf import release; print(release)")
    
        # -----------------------------
        # Fetch latest published version
        # -----------------------------
    
        PUBLISHED_VERSION=$(python - <<EOF
        import json, urllib.request
        pkg = "$PACKAGE_NAME"
        url = f"https://pypi.org/pypi/{pkg}/json"
        with urllib.request.urlopen(url) as r:
            print(json.load(r)["info"]["version"])
        EOF
            )
        
            echo "Version in __init__.py:        $INIT_VERSION"
            echo "Version in pyproject.toml:    $TOML_VERSION"
            echo "Version in conf.py:           $SH_VERSION"
            echo "Published version on PyPI:    $PUBLISHED_VERSION"
        
            # --------------------------------
            # Internal consistency check
            # --------------------------------
        
            if [ "$INIT_VERSION" != "$TOML_VERSION" ] || \
               [ "$INIT_VERSION" != "$SH_VERSION" ] || \
               [ "$TOML_VERSION" != "$SH_VERSION" ]; then
                echo "❌ Version mismatch between source files!"
                exit 1
            fi
        
            echo "✅ Internal versions match"
        
            # --------------------------------
            # Compare to published PyPI version
            # --------------------------------
        
            python - <<EOF
        from packaging.version import Version
        
        local = Version("$INIT_VERSION")
        published = Version("$PUBLISHED_VERSION")
        
        if local <= published:
            raise SystemExit(
                f"❌ Local version {local} must be greater than published version {published}"
            )
        
        print(f"✅ Local version {local} is newer than published version {published}")
        EOF
        ``
        
  test-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    permissions:
      id-token: write        # For trusted publishing to TestPyPI
      pull-requests: write   # For commenting on PRs
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      
    - name: Set up Python
      run: uv python install 3.11
      
    - name: Create dev version for TestPyPI
      run: |
        # Create unique version for PR testing (e.g., 0.1.0.dev42001701234567)
        PR_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        DEV_VERSION="${PR_VERSION}.dev${{ github.event.number }}$(date +%s)"
        sed -i "s/version = \".*\"/version = \"$DEV_VERSION\"/" pyproject.toml
        echo "Created dev version: $DEV_VERSION"
        
    - name: Build package
      run: uv build
      
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const version = process.env.DEV_VERSION || 'dev-version';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **TestPyPI Release Published**\n\nYou can test this version with:\n\`\`\`bash\npip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ gwrefpy\n\`\`\`\n\n_This is a staging release for testing purposes only._`
          })

  publish-and-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: write  # For creating releases
      id-token: write  # For trusted publishing to PyPI
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      
    - name: Set up Python
      run: uv python install 3.11
      
    - name: Build package
      run: uv build
      
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
        
    - name: Get version from pyproject.toml
      id: get_version
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        generate_release_notes: true
        files: |
          dist/*.tar.gz
          dist/*.whl
        body: |
          ## 📦 PyPI Release
          
          This release has been automatically published to PyPI.
          
          **Install with pip:**
          ```bash
          pip install gwrefpy==${{ steps.get_version.outputs.version }}
          ```
          
          **Install with uv:**
          ```bash
          uv add gwrefpy==${{ steps.get_version.outputs.version }}
          ```
          
          **Or upgrade with pip:**
          ```bash
          pip install --upgrade gwrefpy
          ```
          
          **Or upgrade with uv:**
          ```bash
          uv add gwrefpy@latest
          ```
          
    - name: Build and deploy documentation
      run: |
        uv sync --group dev
        cd docs/
        uv run make html
        
    - name: Deploy documentation to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
